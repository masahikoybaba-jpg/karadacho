<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8e7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="からだ帳">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>からだ帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8e7; --ink:#5b4034; --deep:#6b4a3a; --sub:#8a6a58; --mute:#a89080;
  --sage:#bfe3f5; --lilac:#ffd9e2; --violet:#f2708f; --pale:#ffe39a; --leaf:#9ccf8a;
  --glass:rgba(255,255,255,.88); --line:rgba(107,74,58,.16);
  --num:"Nunito","Zen Maru Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);overflow-x:hidden}
body{font-family:var(--body);font-weight:500;color:var(--ink);font-size:16px;line-height:1.5;min-height:100dvh;max-width:520px;margin:0 auto;
  padding:0 20px calc(96px + env(safe-area-inset-bottom));position:relative}
@media (max-width:560px){body{overflow-x:hidden}}
header,main{position:relative;z-index:1}
#bg{position:fixed;inset:0;z-index:0;background-repeat:repeat}
#bg.bg-today{background-color:#fff1c2;background-image:radial-gradient(circle,#fff 0 7px,transparent 8px),radial-gradient(circle,#ffe08a 0 4px,transparent 5px);background-size:72px 72px;background-position:0 0,36px 36px}
#bg.bg-graph{background-color:#cdeaf9;background-image:radial-gradient(circle,rgba(255,255,255,.9) 0 16px,transparent 17px),radial-gradient(circle,rgba(255,255,255,.9) 0 11px,transparent 12px);background-size:150px 120px;background-position:0 0,22px 6px}
#bg.bg-hist{background-color:#dff1cf;background-image:radial-gradient(circle,#b9dda1 0 3px,transparent 4px),radial-gradient(circle,#fff 0 3px,transparent 4px);background-size:56px 56px;background-position:0 0,28px 28px}
#bg.bg-set{background-color:#ffe4eb;background-image:radial-gradient(circle,#fff 0 6px,transparent 7px),radial-gradient(circle,#ffc2d1 0 4px,transparent 5px);background-size:72px 72px;background-position:0 0,36px 36px}
#bg.has{background-size:cover;background-position:center;background-repeat:no-repeat}
.bgrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.bgrow .th{flex:none;width:44px;height:60px;border-radius:12px;background:#fff center/cover no-repeat;border:2px dashed var(--mute)}
.bgrow .th.on{border:2px solid var(--deep)}
.bgrow span{flex:1;font-weight:700}
.bgrow button{height:38px;padding:0 14px;border-radius:99px;background:var(--sage);font-size:13px;font-weight:700;color:var(--deep)}
.bgrow button.x{background:transparent;color:var(--sub);padding:0 6px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
li{list-style:none}

.view{display:none}
.view.on{display:block}
.view.on>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.view.on>*:nth-child(2){animation-delay:.05s}.view.on>*:nth-child(3){animation-delay:.1s}.view.on>*:nth-child(4){animation-delay:.15s}.view.on>*:nth-child(5){animation-delay:.2s}.view.on>*:nth-child(6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.lab{font-size:12px;font-weight:700;letter-spacing:.3em;color:var(--sub)}
.card{background:var(--glass);border-radius:24px;padding:18px;margin-top:12px}
h2{font-size:17px;font-weight:700;letter-spacing:.08em;display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
h2 em{font-style:normal;font-size:11px;font-weight:500;color:var(--sub);letter-spacing:.04em}
.pt{padding-top:calc(22px + env(safe-area-inset-top))}

/* date */
.datebar{display:flex;align-items:center;justify-content:space-between;background:var(--glass);border-radius:99px;padding:6px 6px 6px 18px}
.datebar .d{font-family:var(--num);font-weight:600;font-size:15px;letter-spacing:.12em;color:var(--sub)}
.datebar .d i{font-style:normal;font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.06em;background:var(--deep);color:var(--bg);border-radius:99px;padding:2px 10px;margin-left:8px}
.datebar .ar{display:flex;gap:8px}
.datebar button{width:42px;height:42px;border-radius:50%;background:var(--sage);font-size:18px;color:var(--deep)}
.datebar button:disabled{opacity:.35}

/* weight hero */
.hero{margin-top:18px}
.numin{display:flex;align-items:baseline}
.numin input{border:none;background:transparent;outline:none;font-family:var(--num);font-weight:700;color:var(--deep);letter-spacing:-.04em;line-height:1;font-size:98px;padding:0;border-radius:12px;min-width:0}
.numin input::placeholder{color:rgba(107,74,58,.22)}
.numin input:focus{background:rgba(255,255,255,.6)}
.numin .u{font-family:var(--num);font-weight:600;font-size:22px;color:var(--sub);margin-left:6px}
.delta{font-size:12px;color:var(--sub);margin-top:8px;min-height:22px;display:flex;flex-wrap:wrap;gap:2px 16px}
.delta b{font-family:var(--num);font-weight:700;font-size:16px;color:var(--deep)}
#spark{margin:6px -18px 0;min-height:6px}
svg{display:block;width:100%;height:auto}

/* morning / night tiles */
.ampm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tile{border-radius:84px 84px 24px 24px;padding:22px 10px 14px;text-align:center;min-width:0;background:var(--glass)}
.tile.pm{background:var(--lilac)}
.tile .hd{font-size:13px;font-weight:700;letter-spacing:.3em;color:var(--sub);display:flex;justify-content:center;align-items:center;gap:6px;padding-left:.3em}
.tile .hd svg{width:17px;height:17px;stroke:var(--deep);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile .numin{justify-content:center}
.tile .numin input{text-align:center}
.tile .numin.wt{margin-top:6px}
.tile .numin.wt input{font-size:46px;letter-spacing:-.03em;line-height:1.1}
.tile .numin.wt .u{font-size:14px;margin-left:3px}
.tile .sm{display:block;font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--sub);margin-top:8px}
.tile .numin.ft input{font-size:24px;letter-spacing:-.02em;line-height:1.2}
.tile .numin.ft .u{font-size:12px;margin-left:3px}
.kcrow{display:flex;justify-content:space-between;align-items:baseline;padding:12px 20px}
.kcrow .v{font-family:var(--num);font-weight:700;font-size:30px;line-height:1.1;color:var(--deep);letter-spacing:-.02em}
.kcrow .v small{font-size:12px;font-weight:600;margin-left:3px;color:var(--sub);letter-spacing:0}

/* arches */
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.arch{background:var(--glass);border-radius:70px 70px 20px 20px;padding:18px 12px 12px;text-align:center;min-width:0}
.arch span{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--sub);display:block}
.arch .v{display:flex;justify-content:center;align-items:baseline;font-family:var(--num);font-weight:700;font-size:32px;line-height:1.2;color:var(--deep);letter-spacing:-.02em}
.arch .v small{font-size:12px;font-weight:600;margin-left:3px;color:var(--sub);letter-spacing:0}
.arch .numin{justify-content:center}
.arch .numin input{font-size:32px;line-height:1.2;letter-spacing:-.02em;text-align:center}
.arch .numin .u{font-size:12px;margin-left:3px}

/* goal */
.goal{margin-top:12px;background:var(--deep);color:var(--bg);border-radius:24px;padding:14px 18px;display:flex;align-items:center;gap:14px}
.goal .ring{flex:none;width:62px;height:62px}
.goal .ring text{font-family:var(--num);font-weight:700;font-size:15px;fill:var(--bg)}
.goal p{font-size:12px;line-height:1.6;opacity:.92}
.goal p b{display:block;font-size:15px;font-weight:700}
.goal p b em{font-style:normal;font-family:var(--num);font-weight:700;font-size:30px;margin:0 5px;color:var(--pale);letter-spacing:-.02em}
.goal a{color:var(--pale);font-weight:700;text-decoration:underline;cursor:pointer}

/* meals */
.slots{display:flex;gap:6px;margin-bottom:10px}
.slots button{flex:1;height:40px;border-radius:99px;font-size:13px;font-weight:700;color:var(--sub);background:rgba(107,74,58,.07)}
.slots button.on{background:var(--deep);color:var(--bg)}
.add{display:block}
.add input{width:100%}
.dr{padding:10px 0;border-top:1px solid var(--line)}
.dr:first-child{border-top:none;margin-top:4px}
.dn{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dn b{font-weight:700;overflow-wrap:anywhere}
.tag{font-size:11px;font-weight:700;border-radius:99px;padding:1px 9px;background:var(--sage);color:var(--deep);white-space:nowrap}
.tag.mine{background:var(--pale)}
.tag.none{background:var(--lilac);color:#a8324f}
.dc{display:flex;align-items:center;gap:6px;margin-top:6px}
.sz{display:flex;flex:1;min-width:0;background:rgba(107,74,58,.07);border-radius:99px;padding:3px}
.sz button{flex:1;height:32px;border-radius:99px;font-size:12px;font-weight:700;color:var(--sub);white-space:nowrap;padding:0 2px}
.sz button.on{background:var(--deep);color:var(--bg)}
.dk{flex:none;width:66px;height:38px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-align:right;padding:0 8px;font-family:var(--num);font-weight:700;font-size:17px;color:var(--deep);outline:none}
.dk:focus{border-color:var(--deep)}
.dk.need{border-color:#f2708f;background:#fff5f7}
.dc .ku{font-size:11px;color:var(--sub)}
.dc .rm{flex:none;width:30px;height:30px;border-radius:50%;color:var(--mute);font-size:17px}
.dsum{display:flex;justify-content:space-between;align-items:baseline;padding:10px 2px 8px;border-top:2px solid var(--deep);margin-top:2px;font-weight:700}
.dsum b{font-family:var(--num);font-size:24px;color:var(--deep)}
.dsum b small{font-family:var(--body);font-size:11px;font-weight:500;color:var(--sub);margin-left:3px}
#draft .btn{margin:0;background:var(--deep);color:var(--bg)}
.dhint{font-size:11px;color:var(--sub);line-height:1.6;margin-top:8px}
.add input{height:46px;border:1.5px solid transparent;border-radius:99px;padding:0 16px;background:#fff;min-width:0;outline:none}
.add input:focus{border-color:var(--deep)}
.add input::placeholder{color:var(--mute)}
.add button{width:46px;height:46px;border-radius:50%;background:var(--violet);color:#fff;font-size:24px;line-height:1}
.cands{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.cands::-webkit-scrollbar{display:none}
.cands button{flex:none;height:36px;padding:0 14px;border-radius:99px;background:var(--lilac);font-size:13px;white-space:nowrap}
.cands button b{font-family:var(--num);font-weight:700;margin-left:6px;color:var(--deep)}
.hint{font-size:12px;color:var(--sub);padding-top:10px}
.meals{margin-top:10px}
.meals li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.meals li i{font-style:normal;flex:none;width:30px;font-size:12px;font-weight:700;color:var(--sub)}
.meals li span{flex:1;min-width:0;overflow-wrap:anywhere}
.meals li b{font-family:var(--num);font-weight:700;font-size:17px;white-space:nowrap;color:var(--deep)}
.meals li b small{font-family:var(--body);font-weight:500;font-size:10px;color:var(--sub);margin-left:2px}
.meals li button{width:30px;height:30px;border-radius:50%;color:var(--mute);font-size:17px;flex:none}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:20px 0 6px}

/* graph */
.seg{display:flex;background:var(--glass);border-radius:99px;padding:4px}
.seg button{flex:1;height:38px;border-radius:99px;font-size:13px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--deep);color:var(--bg)}
.gh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.gh .v{font-family:var(--num);font-weight:700;font-size:58px;line-height:1.05;color:var(--deep);letter-spacing:-.04em}
.gh .v small{font-size:16px;font-weight:600;color:var(--sub);margin-left:5px;letter-spacing:0}
.pill{font-size:12px;font-weight:700;background:var(--lilac);border-radius:99px;padding:4px 12px;white-space:nowrap}
svg text{font-family:var(--num);font-size:10px;font-weight:600;fill:var(--mute)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;font-weight:700;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:16px;height:0;border-top:2.5px solid;vertical-align:middle;margin-right:5px}
.c-li{background:var(--lilac)}
.c-dp{background:var(--deep);color:var(--bg)}
.c-dp h2 em{color:rgba(255,248,231,.7)}
.c-dp svg text{fill:rgba(255,248,231,.65)}

/* history */
.hist .hh{display:grid;grid-template-columns:58px 1fr 1fr 64px;gap:6px;padding:6px 16px 6px 10px;background:var(--glass);border-radius:99px;text-align:right;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--sub)}
.hist .c{display:block;line-height:1.25}
.hist .c em{display:block;font-style:normal;font-family:var(--num);font-weight:600;font-size:12px;color:var(--sub)}
.hist button{display:grid;grid-template-columns:58px 1fr 1fr 64px;align-items:center;width:100%;text-align:right;padding:10px 16px 10px 10px;background:var(--glass);border-radius:20px;margin-top:8px;gap:6px}
.hist .dt{width:48px;height:48px;border-radius:50% 50% 14px 14px;background:var(--sage);display:grid;place-items:center;align-content:center;font-family:var(--num);font-weight:700;font-size:15px;line-height:1.1;color:var(--deep)}
.hist .dt small{font-family:var(--body);font-size:10px;font-weight:700;color:var(--sub)}
.hist b{font-family:var(--num);font-weight:700;font-size:18px;color:var(--deep)}
.hist b small{font-family:var(--body);font-size:10px;font-weight:500;color:var(--sub);margin-left:2px}
.hist .no{color:#d9cbbf}

/* settings */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.1em;margin:0 0 5px 6px}
.field input{width:100%;height:50px;border:1.5px solid transparent;border-radius:99px;padding:0 18px;background:#fff;outline:none}
.field input:focus{border-color:var(--deep)}
.btn{display:block;width:100%;height:50px;border-radius:99px;background:#fff;font-weight:700;margin-bottom:8px;color:var(--deep)}
.btn.p{background:var(--deep);color:var(--bg)}
.note{font-size:12px;color:var(--sub);line-height:1.7;padding:6px 6px 0}

nav{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;display:flex;justify-content:center;pointer-events:none;padding:0 20px}
nav div{pointer-events:auto;width:100%;max-width:480px;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-radius:99px;padding:5px;box-shadow:0 10px 30px rgba(107,74,58,.18)}
nav button{height:42px;border-radius:99px;font-size:13px;font-weight:700;color:var(--sub);transition:background .2s,color .2s}
nav button.on{background:var(--deep);color:var(--bg)}

#toast{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--deep);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:9;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="bg" class="bg-today"></div>
<main>
  <section class="view on pt" id="v-today"></section>
  <section class="view pt" id="v-graph"></section>
  <section class="view pt" id="v-hist"></section>
  <section class="view pt" id="v-set"></section>
</main>

<nav><div>
  <button data-tab="today" class="on">記録</button>
  <button data-tab="graph">グラフ</button>
  <button data-tab="hist">履歴</button>
  <button data-tab="set">設定</button>
</div></nav>
<div id="toast"></div>

<script>
(function(){
'use strict';
const KEY='dietlog.v1';
const SLOTS=['朝','昼','夕','間食'];
const WD=['日','月','火','水','木','金','土'];
const WDE=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- storage ----------
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.days)return Object.assign({settings:{},foods:{}},d);}catch(e){}
  return {settings:{},days:{},foods:{}};
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast('保存できませんでした');}
}
let db=load();

// ---------- dates ----------
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const dayNum=s=>Math.round(parse(s).getTime()/864e5);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);};
const today=()=>ymd(new Date());
const md=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate();};

// ---------- state ----------
let cur=today(), tab='today', range=30;
let slot=(h=>h<10?'朝':h<15?'昼':h<21?'夕':'間食')(new Date().getHours());

const fmt1=n=>(Math.round(n*10)/10).toFixed(1);
const signed=n=>(n>0?'+':n<0?'−':'±')+fmt1(Math.abs(n));
function day(d,create){
  if(!db.days[d]&&create)db.days[d]={meals:[]};
  return db.days[d];
}
function tidy(d){
  const x=db.days[d];
  if(x&&x.weight==null&&x.fat==null&&x.weightPm==null&&x.fatPm==null&&!(x.meals&&x.meals.length))delete db.days[d];
}
const kcalOf=x=>(x&&x.meals||[]).reduce((s,m)=>s+(m.kcal||0),0);
// weight / fat hold the morning value (records made before v4 are kept as morning); weightPm / fatPm hold the night value.
// rep() is the day's reference value: morning, or night when morning is missing.
const rep=(x,key)=>x?(x[key]!=null?x[key]:(x[key+'Pm']!=null?x[key+'Pm']:null)):null;
function series(key){
  return Object.keys(db.days).sort().filter(d=>rep(db.days[d],key)!=null).map(d=>({d:d,x:dayNum(d),y:rep(db.days[d],key)}));
}
function seriesRaw(key){
  return Object.keys(db.days).sort().filter(d=>db.days[d][key]!=null).map(d=>({d:d,x:dayNum(d),y:db.days[d][key]}));
}
function toast(t){
  const el=$('#toast');el.textContent=t;el.classList.add('on');
  clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1600);
}
function smooth(P){
  let path='M'+P[0][0].toFixed(1)+' '+P[0][1].toFixed(1);
  for(let i=1;i<P.length;i++){
    const a=P[i-2]||P[i-1], b=P[i-1], c=P[i], d=P[i+1]||c;
    path+=' C'+(b[0]+(c[0]-a[0])/6).toFixed(1)+' '+(b[1]+(c[1]-a[1])/6).toFixed(1)+' '+(c[0]-(d[0]-b[0])/6).toFixed(1)+' '+(c[1]-(d[1]-b[1])/6).toFixed(1)+' '+c[0].toFixed(1)+' '+c[1].toFixed(1);
  }
  return path;
}
function fit(el){
  if(!el)return;
  const cs=getComputedStyle(el), m=fit.m||(fit.m=document.body.appendChild(document.createElement('span')));
  m.style.cssText='position:absolute;visibility:hidden;white-space:pre;left:-9999px;top:0';
  m.style.font=cs.font;m.style.letterSpacing=cs.letterSpacing;
  m.textContent=el.value||el.placeholder;
  el.style.width=Math.ceil(m.getBoundingClientRect().width+6)+'px';
}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(typeof fitAll==='function')fitAll();});

// ---------- food dictionary: rough kcal per usual serving, looked up from the typed menu ----------
const DICT_SRC=`ごはん|ご飯|白米|白ごはん|米:240:杯=240,膳=240
玄米ごはん|玄米:230
雑穀ごはん|雑穀米|もち麦ごはん:235

let DR=[];const DMAP=new Map();
function tokens(text){
  const out=[];
  String(text).split(/[、,，・\/／\n]+/).forEach((part,pi)=>{
    part.trim().split(/\s+/).forEach(p=>{
      if(!p)return;
      const last=out[out.length-1];
      if(last&&last.pi===pi&&!parseTok(p).name)last.raw+=' '+p;else out.push({raw:p,pi:pi});
    });
  });
  return out.map(o=>o.raw);
}
function lastTok(){
  const el=$('#mn'), t=tokens(el?el.value:'');

}
function parseDraft(){

    const key=raw+'#'+(seen[raw]=(seen[raw]||0)+1);
    let e=DMAP.get(key);

      const p=parseTok(raw);if(!p.name)return;
      const f=lookup(p.name,p.counter);
      e={key:key,raw:raw,name:p.name,size:p.size,qty:p.qty,counter:p.counter,unit:f?f.unit:null,src:f?f.src:'none',fkey:f&&f.fkey,label:f?f.label:'辞書にありません',edited:false};
      DMAP.set(key,e);

  });

  DMAP.forEach((v,k)=>{if(!keep.has(k))DMAP.delete(k);});
}
const dKcal=e=>e.unit==null?null:Math.round(e.unit*e.qty*SIZES[e.size][1]);

function lineChart(pts,o){

  if(o.pace){
    const a=Math.max(x0,o.pace.x0), b=Math.min(x1,o.pace.x1);
    if(b>a){
      const at=x=>o.pace.y0+(o.pace.y1-o.pace.y0)*(x-o.pace.x0)/(o.pace.x1-o.pace.x0);
      pace=[a,at(a),b,at(b)];ys.push(pace[1],pace[3]);
    }
  }
  if(o.goal!=null)ys.push(o.goal);
  const sec=(o.second||[]).filter(p=>p.x>=x0&&p.x<=x1);
  sec.forEach(p=>ys.push(p.y));
  let lo=Math.min.apply(null,ys), hi=Math.max.apply(null,ys);
  const padY=Math.max((hi-lo)*.14,.5);lo-=padY;hi+=padY;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R), Y=y=>T+(hi-y)/(hi-lo)*(H-T-B);

  for(let i=0;i<3;i++){
    const v=lo+(hi-lo)*(i+.5)/3, y=Y(v);
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="'+o.grid+'"/><text x="'+(W-R+6)+'" y="'+(y+3)+'">'+fmt1(v)+'</text>';
  }

  if(pace)s+='<line x1="'+X(pace[0])+'" y1="'+Y(pace[1])+'" x2="'+X(pace[2])+'" y2="'+Y(pace[3])+'" stroke="#f2708f" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>';
  s+='<path d="'+path+' L'+last[0].toFixed(1)+' '+base+' L'+P[0][0].toFixed(1)+' '+base+' Z" fill="url(#'+o.id+')"/>';
  if(sec.length){
    const Q=sec.map(p=>[X(p.x),Y(p.y)]);
    if(Q.length>1)s+='<path d="'+smooth(Q)+'" fill="none" stroke="'+o.secondColor+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>';
    Q.forEach(q=>{s+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="2.2" fill="'+o.secondColor+'"/>';});

      lineChart(w,{id:'gw',color:'#6b4a3a',fill:'#9ccf8a',fillOp:.35,dot:'#f2708f',dotRing:'#ffffff',grid:'rgba(107,74,58,.12)',goal:g,pace:pace,second:wPm,secondColor:'#a89080',label:'体重の推移',empty:'体重を記録すると、ここにグラフが出ます'})+
      (w.length?'<div class="legend"><span><i style="border-color:#6b4a3a"></i>朝（基準）</span>'+(wPm.length?'<span><i style="border-color:#a89080;border-top-width:1.6px"></i>夜</span>':'')+(g!=null?'<span><i style="border-color:#f2708f"></i>目標 '+fmt1(g)+' kg</span>':'')+(pace?'<span><i style="border-color:#f2708f;border-top-style:dotted"></i>期日までの目安</span>':'')+'</div>':'')+'</div>'+
    '<div class="two" style="grid-template-columns:repeat(3,1fr);margin-top:12px"><div class="arch"><span>週平均体重</span><div class="v" style="font-size:24px">'+avg+'<small>kg</small></div></div><div class="arch"><span>体脂肪率</span><div class="v" style="font-size:24px">'+(lastF?fmt1(lastF.y):'–')+'<small>%</small></div></div><div class="arch"><span>週平均摂取</span><div class="v" style="font-size:24px">'+kavg+'<small>kcal</small></div></div></div>'+
    '<div class="card c-dp"><h2>体脂肪率<em>%</em></h2>'+lineChart(f,{id:'gf',color:'#ffe39a',fill:'#ffe39a',fillOp:.3,dot:'#ffe39a',dotRing:'#6b4a3a',grid:'rgba(255,255,255,.14)',second:fPm,secondColor:'rgba(255,248,231,.55)',label:'体脂肪率の推移',emptyColor:'rgba(255,248,231,.75)',empty:'体脂肪率を記録すると、ここにグラフが出ます'})+
      (fPm.length?'<div class="legend" style="color:rgba(255,248,231,.8)"><span><i style="border-color:#ffe39a"></i>朝（基準）</span><span><i style="border-color:rgba(255,248,231,.55);border-top-width:1.6px"></i>夜</span></div>':'')+'</div>'+
    '<div class="card c-li"><h2>摂取カロリー<em>直近14日・kcal</em></h2>'+barChart()+'</div>';
}

// ---------- history ----------
function renderHist(){
  const ds=Object.keys(db.days).sort().reverse();
  $('#v-hist').innerHTML='<h2 class="card" style="margin:0 0 8px;padding:12px 20px;border-radius:99px">履歴<em>'+ds.length+'日分・タップで開く</em></h2>'+
    (ds.length?'<div class="hist"><div class="hh"><span></span><span>朝</span><span>夜</span><span>摂取</span></div>'+ds.map(d=>{
      const x=db.days[d], k=kcalOf(x), dt=parse(d);
      const cell=(w,f)=>'<span class="c">'+(w!=null?'<b>'+fmt1(w)+'<small>kg</small></b>':'<b class="no">–</b>')+(f!=null?'<em>'+fmt1(f)+'%</em>':'')+'</span>';
      return '<button data-open="'+d+'"><span class="dt">'+md(d)+'<small>'+WD[dt.getDay()]+'</small></span>'+
        cell(x.weight,x.fat)+cell(x.weightPm,x.fatPm)+
        (k?'<span class="c"><b>'+k+'</b><em>kcal</em></span>':'<b class="no">–</b>')+'</button>';
    }).join('')+'</div>':'<div class="card"><p class="empty" style="padding:14px 0">まだ記録がありません</p></div>');
}

// ---------- background pictures (kept on this device only, in IndexedDB; never uploaded) ----------
const PAGES=[['today','記録'],['graph','グラフ'],['hist','履歴'],['set','設定']];
const BG={};let bgTarget=null;
function idb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('karadacho',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('bg');
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
}
function idbDo(mode,fn){
  return idb().then(d=>new Promise((res,rej)=>{
    const tx=d.transaction('bg',mode), q=fn(tx.objectStore('bg'));
    tx.oncomplete=()=>{d.close();res(q.result);};
    tx.onerror=tx.onabort=()=>{d.close();rej(tx.error);};
  }));
}
function setBg(k,blob){
  if(BG[k])URL.revokeObjectURL(BG[k]);
  if(blob)BG[k]=URL.createObjectURL(blob);else delete BG[k];
}
function applyBg(){
  const el=$('#bg');
  el.className='bg-'+tab+(BG[tab]?' has':'');
  el.style.backgroundImage=BG[tab]?'url("'+BG[tab]+'")':'';
}
function loadBgs(){
  return Promise.all(PAGES.map(p=>idbDo('readonly',st=>st.get(p[0])).then(b=>{if(b)setBg(p[0],b);})))
    .then(()=>{applyBg();if(tab==='set')renderSet();}).catch(()=>{});
}
function shrink(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{
      const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)), c=document.createElement('canvas');
      c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',.86);
    };
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('image'));};
    im.src=u;
  });
}
function bgCard(){
  return '<div class="card"><h2>背景画像<em>ページごとに1枚</em></h2>'+PAGES.map(p=>{
    const u=BG[p[0]];
    return '<div class="bgrow"><div class="th'+(u?' on':'')+'"'+(u?' style="background-image:url(&quot;'+u+'&quot;)"':'')+'></div><span>'+p[1]+'</span>'+
      '<button data-bgpick="'+p[0]+'">'+(u?'変える':'選ぶ')+'</button>'+
      (u?'<button class="x" data-bgdel="'+p[0]+'" aria-label="'+p[1]+'の背景を消す">消す</button>':'')+'</div>';
  }).join('')+'<input type="file" id="bf" accept="image/*" hidden>'+
  '<p class="note">選んだ画像はこの端末の中だけに保存され、ネットには送られません。バックアップには含まれないので、機種変更のときは選び直してください。</p></div>';
}

// ---------- settings ----------
function renderSet(){
  const s=db.settings;
  $('#v-set').innerHTML=
    '<div class="card" style="margin-top:0"><h2>目標</h2>'+
      '<div class="field"><label for="gw">目標体重（kg）</label><input id="gw" inputmode="decimal" placeholder="例 62.0" value="'+(s.goalWeight!=null?s.goalWeight:'')+'"></div>'+
      '<div class="field"><label for="gd">いつまでに</label><input id="gd" type="date" value="'+(s.goalDate||'')+'"></div>'+
      '<button class="btn p" id="gs">目標を保存</button></div>'+
    bgCard()+
    '<div class="card c-li"><h2>データ</h2>'+
      '<button class="btn" id="csv">CSVで書き出す（Excel用）</button>'+
      '<button class="btn" id="bk">バックアップを保存</button>'+
      '<button class="btn" id="rs">バックアップから戻す</button>'+
      '<input type="file" id="rf" accept=".json,application/json" hidden>'+
      '<p class="note">記録はこの端末のこのブラウザの中だけに保存されます。ブラウザのデータを消すと記録も消えるので、ときどきバックアップを保存してください。</p></div>';
}
function download(name,text,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function csv(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['日付','朝体重kg','朝体脂肪率%','夜体重kg','夜体脂肪率%','合計kcal'].concat(SLOTS.map(s=>'食事（'+s+'）'))];
  Object.keys(db.days).sort().forEach(d=>{
    const x=db.days[d];
    rows.push([d,x.weight,x.fat,x.weightPm,x.fatPm,kcalOf(x)||''].concat(SLOTS.map(s=>(x.meals||[]).filter(m=>m.slot===s).map(m=>m.name+'('+m.kcal+')').join(' / '))));
  });
  download('karadacho_'+today()+'.csv','﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv');
}

// ---------- routing / events ----------
const R={today:renderToday,graph:renderGraph,hist:renderHist,set:renderSet};
function show(t){
  tab=t;
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  R[t]();applyBg();window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button,a');if(!b)return;
  const ds=b.dataset;
  if(ds.tab)return show(ds.tab);
  if(ds.go)return show(ds.go);
  if(ds.shift){const n=addDays(cur,+ds.shift);if(n<=today()){cur=n;renderToday();}return;}
  if(ds.slot){slot=ds.slot;document.querySelectorAll('.slots button').forEach(x=>x.classList.toggle('on',x.dataset.slot===slot));const m=$('#ma');if(m)m.textContent=slot+'に追加する';return;}
  if(ds.sz){const a=ds.sz.split('-');if(DR[+a[0]]){DR[+a[0]].size=+a[1];renderDraft();}return;}
  if(ds.drm!=null){const x=DR[+ds.drm];$('#mn').value=DR.filter(e=>e!==x).map(e=>e.raw).join('、');renderDraft();$('#cands').innerHTML=candsHtml(lastTok());return;}
  if(ds.food){const f=db.foods[ds.food];if(f)addMeal(ds.food,f.kcal);return;}
  if(ds.del){const x=db.days[cur];if(x){x.meals=x.meals.filter(m=>m.id!==ds.del);tidy(cur);save();refresh();}return;}
  if(ds.bgpick){bgTarget=ds.bgpick;return $('#bf').click();}
  if(ds.bgdel){
    const k=ds.bgdel;
    if(!confirm('このページの背景画像を消します。よろしいですか？'))return;
    idbDo('readwrite',st=>st.delete(k)).then(()=>{setBg(k,null);applyBg();renderSet();toast('背景を消しました');}).catch(()=>toast('消せませんでした'));
    return;
  }
  if(ds.range!=null){range=+ds.range;return renderGraph();}
  if(ds.open){cur=ds.open;return show('today');}
  if(b.id==='ma'){addDraft();return;}
  if(b.id==='gs'){
    const raw=$('#gw').value.trim().replace(',','.');
    if(raw===''){delete db.settings.goalWeight;}
    else{const v=Math.round(parseFloat(raw)*10)/10;if(!isFinite(v)||v<20||v>300)return toast('目標体重は 20〜300 で入力してください');db.settings.goalWeight=v;}
    if($('#gd').value)db.settings.goalDate=$('#gd').value;else delete db.settings.goalDate;
    save();toast('目標を保存しました');return show('today');
  }
  if(b.id==='csv'){if(!Object.keys(db.days).length)return toast('まだ記録がありません');return csv();}
  if(b.id==='bk')return download('karadacho_backup_'+today()+'.json',JSON.stringify(db),'application/json');
  if(b.id==='rs')return $('#rf').click();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(FIELDS[t.id]){const F=FIELDS[t.id];numIn(t,F[0],F[1],F[2],F[3]);refresh();}
  if(t.id==='bf'&&t.files[0]&&bgTarget){
    const k=bgTarget, file=t.files[0];t.value='';
    shrink(file).then(b=>idbDo('readwrite',st=>st.put(b,k)).then(()=>{setBg(k,b);applyBg();renderSet();toast('背景を設定しました');}))
      .catch(()=>toast('この画像は設定できませんでした'));
  }
  if(t.id==='rf'&&t.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const d=JSON.parse(fr.result);if(!d||typeof d.days!=='object')throw 0;
        if(!confirm('いまの記録を、バックアップの内容で置き換えます。よろしいですか？'))return;
        db=Object.assign({settings:{},foods:{}},d);save();toast('バックアップから戻しました');show('today');
      }catch(err){toast('このファイルは読み込めませんでした');}
    };
    fr.readAsText(t.files[0]);t.value='';
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='mn'){renderDraft();$('#cands').innerHTML=candsHtml(lastTok());}
  if(e.target.classList.contains('dk')){
    const t=e.target, x=DR[+t.dataset.k], v=parseFloat(t.value.normalize('NFKC'));
    if(x){x.unit=(t.value.trim()===''||!isFinite(v)||v<0)?null:v/(x.qty*SIZES[x.size][1]);x.edited=true;t.classList.toggle('need',x.unit==null);sumDraft();}
  }
  if(FIELDS[e.target.id])fit(e.target);
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing||e.keyCode===229)return;
  if(e.target.id==='mn'){e.preventDefault();addDraft();}
  else if(e.target.classList.contains('dk')){e.preventDefault();e.target.blur();}
  else if(FIELDS[e.target.id])e.target.blur();
});

loadBgs();
show('today');
})();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});</script>
